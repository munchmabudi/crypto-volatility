name: daily-crypto-volatility-update
# Runs every day at 06:00 UTC
# Updates data/data.json and bakes into index.html
schedule: "0 6 * * *"
command: "cd /c/Users/ethan/crypto-volatility && python generate_data.py --output data/data.json --self-contained"
# Dashboard updates daily via free APIs:
# - Prices/volumes/candles: Hyperliquid API (free)
# - Liquidations for BTC/ETH/SOL: SmartMoneyAPI free tier
# - Whale wallet tracking: Hyperliquid clearinghouseState (public, no key needed)
notify: true

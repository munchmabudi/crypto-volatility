name: Daily Dashboard Update

on:
  schedule:
    - cron: '0 6 * * *'  # 6:00 AM UTC daily
  workflow_dispatch:      # manual trigger
  push:
    paths:
      - 'generate_data.py'
      - 'lib/**'
      - '.github/workflows/update.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push data.json back to the repo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard data
        env:
          HYPERTRACKER_API_KEY: ${{ secrets.HYPERTRACKER_API_KEY }}
        run: |
          python generate_data.py --output data/data.json

      - name: Verify data was generated
        run: |
          if [ ! -f data/data.json ]; then echo "::error::data.json was not generated"; exit 1; fi
          echo "data.json size: $(wc -c < data/data.json) bytes"

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update dashboard data ($(date -u +%Y-%m-%d))"
          file_pattern: data/data.json
          branch: main
